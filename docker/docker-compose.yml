# =============================================================================
# MultiCamDrone - Project AirSim docker environment
#
#   docker compose build                      # build both images
#   docker compose up -d sim                  # start the simulator (headless)
#   docker compose run --rm client bash       # shell with the python client
#   docker compose logs -f sim                # watch the Unreal log
#   docker compose down                       # stop everything
#
# The simulator publishes its two API ports on the host, so a client running
# directly on the host (outside docker) works too, against 127.0.0.1.
# =============================================================================

name: multicamdrone

services:

  # ---------------------------------------------------------------------------
  # Unreal Engine simulation server
  # ---------------------------------------------------------------------------
  sim:
    build:
      context: ./sim
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: multicamdrone/airsim-sim:latest
    container_name: airsim-sim

    # GPU access. NVIDIA_DRIVER_CAPABILITIES (set in the Dockerfile and below)
    # is what actually pulls in the graphics/Vulkan driver bits — `capabilities:
    # [gpu]` alone only gives compute+utility.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,display
      SIM_ENV_ROOT: /environments
      SIM_ENV_NAME: ${SIM_ENV_NAME:-Blocks}
      SIM_RENDER_MODE: ${SIM_RENDER_MODE:-offscreen}   # offscreen | nullrhi | windowed
      SIM_RES_X: ${SIM_RES_X:-1280}
      SIM_RES_Y: ${SIM_RES_Y:-720}
      SIM_TOPICS_PORT: 8989
      SIM_SERVICES_PORT: 8990
      SIM_EXTRA_ARGS: ${SIM_EXTRA_ARGS:-}

    volumes:
      # Packaged environments. Writable: Unreal drops its Saved/ logs in here.
      - ../envs:/environments
      # Shared drop box for images/logs produced by the sim.
      - ../output:/output

    ports:
      - "${SIM_BIND_ADDR:-127.0.0.1}:8989:8989"   # topics  (pub/sub)
      - "${SIM_BIND_ADDR:-127.0.0.1}:8990:8990"   # services (req/resp)

    # Unreal is happier with a large shared-memory segment than docker's 64MB.
    shm_size: "2gb"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

    stdin_open: true
    tty: true
    # The container exits when Unreal crashes (PID 1 is `sh <Env>.sh`, which
    # propagates 128+11), so a restart policy genuinely recovers it. This is what
    # was missing when a vm.max_map_count exhaustion killed the sim and it stayed
    # down, leaving the bridge serving a stale topic list to Foxglove.
    restart: unless-stopped
    # Bound the sim's memory so a runaway cannot take the host with it. Steady
    # state is ~1.2GB for Blocks, ~4GB for CityEnviron.
    mem_limit: ${SIM_MEM_LIMIT:-24g}

  # ---------------------------------------------------------------------------
  # ROS2 bridge + Foxglove WebSocket
  # ---------------------------------------------------------------------------
  ros2:
    build:
      context: ./ros2
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: multicamdrone/airsim-ros2:latest
    container_name: airsim-ros2

    environment:
      SIM_ADDRESS: sim
      PROJECTAIRSIM_REPO: /workspace/ProjectAirSim
      # Empty means "attach to the scene that is already loaded" rather than
      # replacing it. Set it to load a scene on the bridge's behalf.
      SCENE_CONFIG: ${SCENE_CONFIG:-}
      SIM_CONFIG_PATH: ${SIM_CONFIG_PATH:-/workspace/workspace/sim_config}
      VEHICLE_NAME: ${VEHICLE_NAME:-Drone1}
      # Leave at 0. The bridge's refresh timer only re-reads a client-side cache
      # (Topics::GetAll sends nothing to the sim) and every topic is already in
      # subscribed_topics_, so it cannot recover from a sim restart -- but its
      # requests do collide with service calls on the single Req0 socket and
      # produce "Incorrect state" errors. Recovery is the supervisor's job.
      REFRESH_TOPICS_SEC: ${REFRESH_TOPICS_SEC:-0.0}
      FOXGLOVE_PORT: 8765
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}

    volumes:
      - ..:/workspace
      - ../output:/output

    ports:
      - "${FOXGLOVE_BIND_ADDR:-0.0.0.0}:8765:8765"   # Foxglove WebSocket

    # DDS discovery and the bridge's image queues both want more than docker's
    # 64MB default.
    shm_size: "2gb"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

    depends_on:
      - sim

    stdin_open: true
    tty: true
    # The bridge cannot recover from a sim restart on its own: subscription state
    # lives in the sim process, and the bridge never re-sends a subscribe frame,
    # so its topics go permanently mute while the node keeps spinning without
    # logging anything. A fresh process is the only fix, so let it restart.
    restart: unless-stopped
    # Run both the Project AirSim bridge and foxglove_bridge in one container.
    command: ["both"]

  # ---------------------------------------------------------------------------
  # Python client
  # ---------------------------------------------------------------------------
  client:
    build:
      context: ./client
      args:
        BASE_IMAGE: ${CLIENT_BASE_IMAGE:-ubuntu:22.04}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: multicamdrone/airsim-client:latest
    container_name: airsim-client

    environment:
      # Inside the compose network the simulator answers to the name "sim".
      SIM_ADDRESS: sim
      PROJECTAIRSIM_REPO: /workspace/ProjectAirSim
      DISPLAY: ${DISPLAY:-}
      PYTHONPATH: /workspace/ProjectAirSim/client/python/projectairsim/src

    volumes:
      # The whole MultiCamDrone repo, so scripts and the client package are
      # edited on the host and picked up in the container with no rebuild.
      - ..:/workspace
      - ../output:/output
      # X11 socket, so cv2.imshow() windows from the examples appear on the host
      # desktop. Harmless when DISPLAY is unset.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    working_dir: /workspace/ProjectAirSim/client/python/example_user_scripts

    depends_on:
      - sim

    stdin_open: true
    tty: true
